<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>niroMovie | Free Movies</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        :root{--bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--text:#f0f0f0;--text2:#a0a0a0;--text3:#666;--accent:#F5C518;--accentD:#d4a810;--border:#2a2a2a;--radius:12px;--radiusLg:18px;--trans:all 0.25s}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .navbar{position:sticky;top:0;background:rgba(13,13,13,0.94);backdrop-filter:blur(20px);padding:0.6rem 1.5rem;border-bottom:1px solid var(--border);z-index:1000}
        .nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
        .logo{display:flex;align-items:center;gap:0.4rem;cursor:pointer}
        .logo-icon{font-size:1.8rem;color:var(--accent)}
        .logo-text{font-size:1.1rem;font-weight:800}
        .logo-text span{color:var(--accent)}
        .hamburger{cursor:pointer;padding:0.4rem;border-radius:var(--radius);display:flex;align-items:center;color:var(--text2)}
        .nav-links{display:flex;gap:0.2rem;align-items:center;flex-wrap:wrap}
        .nav-link{color:var(--text2);text-decoration:none;font-weight:500;font-size:0.82rem;cursor:pointer;padding:0.4rem 0.8rem;border-radius:30px}
        .nav-link:hover{color:var(--accent);background:rgba(245,197,24,0.06)}
        .search-box{display:flex;align-items:center;background:var(--bg3);border-radius:30px;padding:0.4rem 1rem;gap:0.4rem;width:260px}
        .search-box input{background:transparent;border:none;color:var(--text);width:100%;outline:none;font-family:inherit}
        .profile-icon{width:35px;height:35px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:0.75rem;color:#000}
        .hero-section{padding:1rem 1.5rem;max-width:1400px;margin:0 auto}
        .hero-slider{position:relative;overflow:hidden;border-radius:var(--radiusLg);aspect-ratio:16/5;background:var(--bg3);cursor:pointer}
        .hero-slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity 0.8s;display:flex;align-items:flex-end;padding:1.5rem;background-size:cover;background-position:center}
        .hero-slide.active{opacity:1;z-index:1}
        .hero-slide-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85),rgba(0,0,0,0.05))}
        .hero-slide-info{position:relative;z-index:2;max-width:60%}
        .hero-slide-info h2{color:#fff;font-size:1.3rem;font-weight:800}
        .hero-dots{display:flex;gap:0.4rem;justify-content:center;margin-top:0.6rem}
        .hero-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer}
        .hero-dot.active{background:var(--accent);width:20px;border-radius:4px}
        .section{margin:0.4rem 0;padding:0 1.5rem;max-width:1400px;margin-left:auto;margin-right:auto}
        .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.7rem}
        .section-head h2{font-size:1.15rem;font-weight:700}
        .movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:0.7rem;margin-top:0.7rem}
        .movie-card{background:var(--bg2);border-radius:var(--radiusLg);overflow:hidden;cursor:pointer;position:relative;border:1px solid var(--border);transition:var(--trans)}
        .movie-card:hover{transform:translateY(-4px);box-shadow:0 16px 50px rgba(0,0,0,0.7);border-color:var(--accent)}
        .movie-thumb{width:100%;height:240px;object-fit:cover;background:var(--bg3);display:block}
        .movie-badge{position:absolute;top:8px;right:8px;padding:0.15rem 0.5rem;border-radius:20px;font-size:0.58rem;font-weight:700;background:var(--green);color:#fff}
        .quality-badge{position:absolute;top:8px;left:8px;padding:0.12rem 0.35rem;border-radius:4px;font-size:0.55rem;font-weight:700;background:rgba(0,0,0,0.8);color:#fff}
        .movie-info{padding:0.6rem}
        .movie-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:0.82rem}
        .movie-meta{font-size:0.66rem;color:var(--text2)}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:3000;justify-content:center;align-items:center;backdrop-filter:blur(6px)}
        .modal-overlay.active{display:flex}
        .modal-full{width:100%;height:100vh;background:var(--bg2);display:flex;flex-direction:column}
        .modal-header{padding:0.8rem 1.2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
        .back-btn{cursor:pointer;color:var(--accent);font-weight:600;font-size:0.85rem;display:flex;align-items:center;gap:0.3rem}
        .close-btn{font-size:22px;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text2)}
        .modal-body{padding:1.2rem;overflow-y:auto;flex:1}
        .detail-hero{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;margin-bottom:1rem;position:relative}
        .detail-hero video,.detail-hero img{width:100%;height:100%;object-fit:cover;display:block}
        .detail-title{font-size:2rem;font-weight:800;margin-bottom:0.4rem}
        .detail-desc{color:var(--text2);font-size:0.95rem;line-height:1.6;margin-bottom:0.5rem}
        .detail-desc.truncated{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .detail-meta{display:flex;flex-wrap:wrap;gap:1rem;font-size:0.85rem;color:var(--text2);margin-bottom:1rem}
        .detail-actions{display:flex;gap:0.8rem;margin-bottom:1rem;flex-wrap:wrap}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.7rem 1.3rem;border:none;border-radius:30px;font-weight:700;cursor:pointer;font-size:0.9rem}
        .btn-primary{background:var(--accent);color:#000}
        .btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}
        .btn-hero{flex:1 1 200px;padding:1rem 1.5rem;font-size:1rem;border-radius:40px}
        .parts-list{margin-top:0.8rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0.6rem}
        .part-row{display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0.7rem;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border);cursor:pointer}
        .part-num{width:26px;height:26px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700}
        .part-name{flex:1;font-size:0.8rem}
        .part-actions{display:flex;gap:0.35rem}
        .comment-item{display:flex;gap:0.6rem;padding:0.65rem 0;border-bottom:1px solid var(--border);font-size:0.8rem}
        .comment-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;color:#fff;flex-shrink:0}
        .comment-body{flex:1;min-width:0}
        .comment-user{font-weight:600;color:var(--text)}
        .comment-date{font-size:0.65rem;color:var(--text3);margin-left:0.5rem}
        .comment-text{margin-top:0.15rem;color:var(--text2);word-break:break-word}
        .comment-like{cursor:pointer;color:var(--text3);font-size:0.7rem;margin-top:0.3rem}
        .comment-composer{border:1px solid var(--border);border-radius:var(--radiusLg);padding:0.8rem;background:var(--bg3);margin-bottom:0.8rem}
        .comment-composer input,.comment-composer textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:0.5rem 0.7rem;font-family:inherit;font-size:0.8rem;margin-bottom:0.55rem}
        .comment-composer textarea{resize:none;min-height:64px}
        .footer{background:var(--bg2);border-top:1px solid var(--border);padding:2rem 1.5rem;margin-top:2.5rem;text-align:center;color:var(--text3)}
        @media(max-width:768px){.search-box{width:100%;order:3}.nav-links{display:none}.movie-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.movie-thumb{height:180px}.parts-list{grid-template-columns:1fr}.detail-hero{aspect-ratio:16/9}}
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-container">
            <div style="display:flex;align-items:center;gap:0.6rem">
                <div class="hamburger" onclick="toggleSideMenu()"><span class="material-symbols-outlined">menu</span></div>
                <div class="logo" onclick="loadAllContent()"><span class="material-symbols-outlined logo-icon">play_circle</span><div class="logo-text"><span>niro</span>Movie</div></div>
            </div>
            <div class="nav-links">
                <a class="nav-link active" onclick="loadAllContent()">Home</a>
                <a class="nav-link" onclick="filterContent('series')">Series</a>
                <a class="nav-link" onclick="filterContent('free')">Free</a>
                <a class="nav-link" href="https://news.niromovie.site">News</a>
            </div>
            <div class="search-box"><span class="material-symbols-outlined" style="color:var(--text3)">search</span><input type="text" id="searchInput" placeholder="Search..." onkeyup="searchMovies()"></div>
            <div class="profile-icon" id="profileIcon" onclick="handleProfileClick()">LI</div>
        </div>
    </div>
    <div class="hero-section">
        <div class="hero-slider" id="heroSlider" onclick="heroClick()">
            <div class="hero-slide active" id="heroSlide0"><div class="hero-slide-overlay"></div><div class="hero-slide-info"><h2 id="heroTitle0"></h2></div></div>
            <div class="hero-slide" id="heroSlide1"><div class="hero-slide-overlay"></div><div class="hero-slide-info"><h2 id="heroTitle1"></h2></div></div>
            <div class="hero-slide" id="heroSlide2"><div class="hero-slide-overlay"></div><div class="hero-slide-info"><h2 id="heroTitle2"></h2></div></div>
        </div>
        <div class="hero-dots"><div class="hero-dot active" onclick="goToSlide(0)"></div><div class="hero-dot" onclick="goToSlide(1)"></div><div class="hero-dot" onclick="goToSlide(2)"></div></div>
    </div>
    <div class="section">
        <div class="section-head"><h2>Latest Movies</h2></div>
        <div class="movie-grid" id="movieGrid"></div>
        <button class="btn btn-outline" id="loadMoreBtn" onclick="loadMoreMovies()">Show More</button>
    </div>
    <div class="footer">© 2026 niroMovie. All rights reserved.</div>

    <div class="modal-overlay" id="movieModal" onclick="if(event.target===this)closeMovieModal()">
        <div class="modal-full">
            <div class="modal-header">
                <span class="back-btn" onclick="closeMovieModal()"><span class="material-symbols-outlined">arrow_back</span> Back</span>
                <span class="close-btn" onclick="closeMovieModal()">&times;</span>
            </div>
            <div class="modal-body" id="modalBodyContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div style="max-width:400px;width:100%;background:var(--bg2);border-radius:var(--radiusLg);padding:1.5rem;margin:auto">
            <div style="display:flex;justify-content:space-between;margin-bottom:1rem"><h2 id="authTitle">Sign In</h2><span class="close-btn" onclick="closeModal('authModal')">&times;</span></div>
            <div id="loginDiv">
                <input type="email" id="loginEmail" placeholder="Email" style="width:100%;padding:0.7rem;margin-bottom:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text)">
                <input type="password" id="loginPassword" placeholder="Password" style="width:100%;padding:0.7rem;margin-bottom:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text)">
                <button class="btn btn-primary" onclick="login()" style="width:100%">Sign In</button>
                <p style="text-align:center;margin-top:0.5rem;font-size:0.8rem">No account? <a onclick="showRegisterDiv()" style="color:var(--accent);cursor:pointer">Create one</a></p>
            </div>
            <div id="registerDiv" style="display:none">
                <input type="text" id="regName" placeholder="Full Name" style="width:100%;padding:0.7rem;margin-bottom:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text)">
                <input type="email" id="regEmail" placeholder="Email" style="width:100%;padding:0.7rem;margin-bottom:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text)">
                <input type="password" id="regPassword" placeholder="Password (min 6)" style="width:100%;padding:0.7rem;margin-bottom:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text)">
                <button class="btn btn-primary" onclick="register()" style="width:100%">Create Account</button>
                <p style="text-align:center;margin-top:0.5rem;font-size:0.8rem">Have account? <a onclick="showLoginDiv()" style="color:var(--accent);cursor:pointer">Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://niromovie-api.onrender.com/api';
        let token = localStorage.getItem('token') || null;
        let currentUser = null;
        let allContents = [];
        let premiumContents = [];
        let currentContentId = null;
        let currentContentData = null;
        let currentPartsItems = [];
        let selectedPartIndex = 0;
        let revealedPartsCount = 5;
        let visibleRows = 2;
        const moviesPerRow = 6;
        let heroSlideData = [];
        let currentSlide = 0;
        let heroTimer = null;

        function escHtml(t){var d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
        function toast(msg){var d=document.createElement('div');d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:0.6rem 1.5rem;border-radius:30px;z-index:9999;font-weight:600';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
        function closeModal(id){document.getElementById(id).classList.remove('active');document.body.classList.remove('body-no-scroll')}
        function openModal(id){document.getElementById(id).classList.add('active');if(id==='movieModal')document.body.classList.add('body-no-scroll')}
        function closeMovieModal(){closeModal('movieModal');history.pushState(null,'','/')}
        function toggleSideMenu(){/* not needed */}

        function showLoginDiv(){
            document.getElementById('loginDiv').style.display='block';
            document.getElementById('registerDiv').style.display='none';
            document.getElementById('authTitle').textContent='Sign In';
            document.getElementById('loginEmail').value='';
            document.getElementById('loginPassword').value='';
        }
        function showRegisterDiv(){
            document.getElementById('loginDiv').style.display='none';
            document.getElementById('registerDiv').style.display='block';
            document.getElementById('authTitle').textContent='Create Account';
            document.getElementById('regName').value='';
            document.getElementById('regEmail').value='';
            document.getElementById('regPassword').value='';
        }
        function handleProfileClick(){
            if(currentUser) logout();
            else { showLoginDiv(); openModal('authModal'); }
        }
        async function login(){
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if(!email || !password) return toast('Email and password required');
            try{
                const res = await fetch(API+'/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password})});
                const data = await res.json();
                if(res.ok){
                    token = data.token;
                    localStorage.setItem('token', token);
                    currentUser = data.user;
                    updateProfileIcon();
                    closeModal('authModal');
                    toast('Welcome back!');
                } else toast(data.error || 'Login failed');
            }catch(e){ toast('Network error'); }
        }
        async function register(){
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            if(!name || !email || !password) return toast('All fields required');
            if(password.length < 6) return toast('Password min 6 characters');
            try{
                const res = await fetch(API+'/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password, fullName: name})});
                const data = await res.json();
                if(res.ok){
                    token = data.token;
                    localStorage.setItem('token', token);
                    currentUser = data.user;
                    updateProfileIcon();
                    closeModal('authModal');
                    toast('Account created!');
                } else toast(data.error || 'Registration failed');
            }catch(e){ toast('Network error'); }
        }
        function logout(){
            localStorage.removeItem('token');
            token = null;
            currentUser = null;
            updateProfileIcon();
            loadAllContent();
        }
        function updateProfileIcon(){
            const icon = document.getElementById('profileIcon');
            if(currentUser){
                icon.textContent = (currentUser.fullName || currentUser.email).charAt(0).toUpperCase();
                icon.style.background = 'var(--green)';
            } else {
                icon.textContent = 'LI';
                icon.style.background = 'var(--accent)';
            }
        }

        async function loadAllContent(){
            try{
                const res = await fetch(API+'/contents');
                const data = await res.json();
                if(Array.isArray(data)){
                    allContents = data.filter(c => c.accessLevel === 'free');
                    premiumContents = data.filter(c => c.accessLevel !== 'free');
                    renderAll();
                }
            }catch(e){ console.error(e); }
        }
        function renderAll(){
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = allContents.slice(0, visibleRows*moviesPerRow).map(m => movieCardHTML(m)).join('');
            const btn = document.getElementById('loadMoreBtn');
            if((visibleRows*moviesPerRow) >= allContents.length){
                btn.textContent = 'All loaded';
                btn.disabled = true;
            } else {
                btn.textContent = 'Show More';
                btn.disabled = false;
            }
            setupHero();
        }
        function loadMoreMovies(){
            visibleRows += 2;
            renderAll();
        }
        function movieCardHTML(m){
            return `<div class="movie-card" onclick="openContent('${m._id}')">
                <img class="movie-thumb" src="${m.thumbnailUrl||''}" onerror="this.style.background='var(--bg3)'">
                <div class="quality-badge">${m.quality||'HD'}</div>
                <div class="movie-badge">FREE</div>
                <div class="movie-info">
                    <div class="movie-title">${escHtml(m.title)}</div>
                    <div class="movie-meta">${m.views?`👁 ${m.views.toLocaleString()}`:''} ${m.downloads?`⬇ ${m.downloads.toLocaleString()}`:''}</div>
                </div>
            </div>`;
        }
        function setupHero(){
            heroSlideData = allContents.slice().sort((a,b)=>new Date(b.uploadedAt)-new Date(a.uploadedAt)).slice(0,3);
            for(let i=0;i<3;i++){
                const slide = document.getElementById('heroSlide'+i);
                const s = heroSlideData[i];
                if(s){
                    slide.style.backgroundImage = `url(${s.thumbnailUrl||''})`;
                    document.getElementById('heroTitle'+i).textContent = s.title;
                } else slide.style.display='none';
            }
            showSlide(0);
            startHeroRotation();
        }
        function startHeroRotation(){
            if(heroTimer) clearInterval(heroTimer);
            heroTimer = setInterval(()=>{ currentSlide=(currentSlide+1)%3; showSlide(currentSlide); }, 5000);
        }
        function showSlide(i){
            currentSlide = i;
            document.querySelectorAll('.hero-slide').forEach((s,idx)=>s.classList.toggle('active', idx===i));
            document.querySelectorAll('.hero-dot').forEach((d,idx)=>d.classList.toggle('active', idx===i));
        }
        function goToSlide(i){ showSlide(i); startHeroRotation(); }
        function heroClick(){ const m = heroSlideData[currentSlide]; if(m) openContent(m._id); }

        function isPlayableUrl(url){
            if(!url) return false;
            const lower = url.toLowerCase();
            if(lower.includes('pixeldrain.com') || lower.includes('drive.google.com') || lower.includes('dropbox.com') || lower.includes('mega.nz')) return false;
            return lower.endsWith('.mp4') || lower.endsWith('.webm') || lower.endsWith('.m3u8') || lower.includes('stream.') || lower.includes('video.') || lower.includes('media.');
        }
        function getStreamUrl(url){ return url; }
        function getDownloadUrl(url){ return url; }

        async function openContent(id){
            currentContentId = id;
            selectedPartIndex = 0;
            revealedPartsCount = 5;
            const c = allContents.find(x => x._id === id);
            if(!c) return;
            currentContentData = c;
            history.pushState(null,'','/?movie='+id);
            document.getElementById('modalTitle').textContent = c.title;
            try{
                const partsRes = await fetch(API+'/contents/'+id+'/parts');
                const partsData = await partsRes.json();
                currentPartsItems = partsData.items || [];
            }catch(e){ currentPartsItems = []; }
            const modalBody = document.getElementById('modalBodyContent');
            const canStream = currentPartsItems.length > 0 && currentPartsItems[0].videoUrl && isPlayableUrl(currentPartsItems[0].videoUrl);
            const heroHTML = canStream 
                ? `<div class="detail-hero" id="playerWrapper"><video id="videoPlayer" controls src="${getStreamUrl(currentPartsItems[0].videoUrl)}"></video></div>`
                : `<div class="detail-hero"><img src="${c.thumbnailUrl||''}" onerror="this.style.background='var(--bg3)'"></div>`;
            modalBody.innerHTML = `
                ${heroHTML}
                <h1 class="detail-title">${escHtml(c.title)}</h1>
                <div class="detail-desc truncated" id="modalDesc">${escHtml(c.description||'No description')}</div>
                <div class="detail-meta">
                    <span>${c.year||'N/A'}</span> · <span>${c.quality||'HD'}</span> · <span>FREE</span> · <span>${c.country||''}</span>
                </div>
                <div class="detail-actions">
                    <button class="btn btn-primary btn-hero" id="watchBtn" onclick="watchCurrentContent()" style="display:${canStream?'inline-flex':'none'}">▶ Reba</button>
                    <button class="btn btn-outline btn-hero" id="downloadMainBtn" onclick="downloadCurrentContent()">⬇ Kuramo</button>
                </div>
                <h4>Parts / Episodes</h4>
                <div id="partsList" class="parts-list"></div>
                <div id="showMorePartsContainer"></div>
                <h4 style="margin-top:1rem">Comments</h4>
                <div class="comment-composer">
                    <input type="text" id="commentName" placeholder="Your name">
                    <textarea id="newComment" placeholder="Comment..." maxlength="1000"></textarea>
                    <button class="btn btn-primary" onclick="addComment()">Post</button>
                </div>
                <div id="commentsList"></div>
            `;
            renderPartsList();
            loadComments(id);
            openModal('movieModal');
        }

        function renderPartsList(){
            const container = document.getElementById('partsList');
            if(!container) return;
            if(!currentPartsItems.length){
                container.innerHTML = '<p style="color:var(--text3)">No parts available</p>';
                return;
            }
            const toShow = currentPartsItems.slice(0, revealedPartsCount);
            container.innerHTML = toShow.map((item,i)=>{
                const label = item.title || item.name || `Episode ${i+1}`;
                return `<div class="part-row" onclick="selectPart(${i})">
                    <div class="part-num">${i+1}</div>
                    <div class="part-name">${escHtml(label)}</div>
                    <div class="part-actions">
                        <button class="btn btn-outline" onclick="event.stopPropagation();selectPart(${i})">▶</button>
                        ${item.videoUrl?`<button class="btn btn-outline" onclick="event.stopPropagation();downloadPartItem(${i})">⬇</button>`:''}
                    </div>
                </div>`;
            }).join('');
            const moreContainer = document.getElementById('showMorePartsContainer');
            if(currentPartsItems.length > revealedPartsCount){
                moreContainer.innerHTML = `<button class="btn btn-outline" onclick="revealMoreParts()">Show more (${currentPartsItems.length - revealedPartsCount})</button>`;
            } else moreContainer.innerHTML = '';
        }
        function revealMoreParts(){ revealedPartsCount += 5; renderPartsList(); }
        function selectPart(i){
            const item = currentPartsItems[i];
            if(!item) return;
            selectedPartIndex = i;
            renderPartsList();
            const videoPlayer = document.getElementById('videoPlayer');
            if(videoPlayer && item.videoUrl && isPlayableUrl(item.videoUrl)){
                videoPlayer.src = getStreamUrl(item.videoUrl);
                videoPlayer.play().catch(()=>{});
            }
        }
        function downloadPartItem(i){
            selectPart(i);
            downloadCurrentContent();
        }
        function watchCurrentContent(){
            const item = currentPartsItems[selectedPartIndex];
            if(!item || !item.videoUrl) return;
            if(isPlayableUrl(item.videoUrl)){
                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.src = getStreamUrl(item.videoUrl);
                videoPlayer.play().catch(()=>{});
                const playerWrapper = document.getElementById('playerWrapper');
                if(playerWrapper && playerWrapper.requestFullscreen) playerWrapper.requestFullscreen().catch(()=>{});
            } else toast('Download only');
        }
        function downloadCurrentContent(){
            const item = currentPartsItems[selectedPartIndex];
            if(!item || !item.videoUrl) return;
            window.open(getDownloadUrl(item.videoUrl),'_blank');
        }

        async function loadComments(id){
            const cl = document.getElementById('commentsList');
            try{
                const comments = await fetch(API+'/comments/'+id).then(r=>r.json());
                cl.innerHTML = comments.slice(0,2).map(c=>`<div class="comment-item"><div class="comment-avatar" style="background:var(--accent)">${c.userName.charAt(0)}</div><div class="comment-body"><span class="comment-user">${escHtml(c.userName)}</span><span class="comment-date">${new Date(c.createdAt).toLocaleDateString()}</span><div class="comment-text">${escHtml(c.text)}</div><span class="comment-like">👍 ${c.likes||0}</span></div></div>`).join('') || '<p>No comments yet.</p>';
            }catch(e){ cl.innerHTML = '<p>Comments unavailable</p>'; }
        }
        async function addComment(){
            const name = document.getElementById('commentName').value.trim();
            const text = document.getElementById('newComment').value.trim();
            if(!name || !text) return toast('Name and comment required');
            await fetch(API+'/comments/'+currentContentId, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userName:name, text})});
            document.getElementById('newComment').value='';
            loadComments(currentContentId);
        }

        // Initial load
        loadAllContent();
        updateProfileIcon();
    </script>
</body>
</html>
