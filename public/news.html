<html lang="rw">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        :root{--bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--text:#f0f0f0;--text2:#a0a0a0;--text3:#666;--accent:#F5C518;--border:#2a2a2a;--radius:12px;--radiusLg:18px;--shadow:0 8px 30px rgba(0,0,0,0.5);--trans:all 0.25s cubic-bezier(0.4,0,0.2,1)}
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--text3);border-radius:10px}
        .navbar{position:sticky;top:0;z-index:1000;background:rgba(13,13,13,0.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0.8rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.8rem}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none}
        .logo i{font-size:1.8rem;color:var(--accent)}.logo span{font-weight:800;font-size:1.2rem;color:var(--text)}.logo span b{color:var(--accent)}
        .back-btn{color:var(--accent);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;text-decoration:none}
        .nav-links{display:flex;gap:0.3rem;flex-wrap:wrap;align-items:center}
        .nav-link{color:var(--text2);text-decoration:none;font-weight:500;font-size:0.82rem;padding:0.4rem 0.8rem;border-radius:30px;transition:var(--trans);cursor:pointer}
        .nav-link:hover,.nav-link.active{color:var(--accent);background:rgba(245,197,24,0.06)}
        .nav-link.visit-site{background:var(--accent);color:#000;font-weight:700}.nav-link.visit-site:hover{background:#d4a810}
        .search-box{display:flex;align-items:center;background:var(--bg3);border-radius:30px;padding:0.4rem 1rem;gap:0.4rem;width:220px}
        .search-box input{background:transparent;border:none;color:var(--text);outline:none;width:100%;font-family:inherit;font-size:0.82rem}
        .search-box input::placeholder{color:var(--text3)}
        .container{max-width:1200px;margin:0 auto;padding:1rem 1.5rem}
        .hero-news{background:var(--bg2);border-radius:var(--radiusLg);overflow:hidden;margin-bottom:2rem;display:flex;border:1px solid var(--border);animation:fadeInUp 0.6s ease}
        .hero-news img{width:50%;object-fit:cover;background:var(--bg3)}
        .hero-news-body{padding:2rem;display:flex;flex-direction:column;justify-content:center;gap:0.5rem}
        .hero-news-body .category{color:var(--accent);font-weight:600;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px}
        .hero-news-body h2{font-size:1.5rem;font-weight:800}
        .hero-news-body p{color:var(--text2);font-size:0.9rem;line-height:1.4}
        .btn{display:inline-flex;align-items:center;gap:0.3rem;padding:0.5rem 1.2rem;border-radius:30px;font-weight:600;font-size:0.82rem;cursor:pointer;border:none;font-family:inherit;transition:var(--trans)}
        .btn-accent{background:var(--accent);color:#000}.btn-accent:hover{background:#d4a810;transform:translateY(-2px)}
        .filters{display:flex;gap:0.8rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
        .filter-btn{padding:0.5rem 1.2rem;border-radius:30px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-weight:500;font-size:0.8rem;transition:var(--trans)}
        .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(245,197,24,0.04)}
        .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:2rem}
        .news-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radiusLg);overflow:hidden;cursor:pointer;transition:var(--trans);animation:fadeIn 0.5s ease}
        .news-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
        .news-card img{width:100%;height:180px;object-fit:cover;background:var(--bg3)}
        .news-card-body{padding:1rem}
        .news-card-title{font-weight:700;margin-bottom:0.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .news-card-excerpt{font-size:0.8rem;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .news-card-meta{display:flex;justify-content:space-between;margin-top:0.5rem;font-size:0.7rem;color:var(--text3)}
        .footer{text-align:center;padding:2rem;color:var(--text3);font-size:0.75rem;border-top:1px solid var(--border);margin-top:2rem;display:flex;flex-wrap:wrap;justify-content:center;gap:2rem}
        .footer-links{display:flex;gap:1rem}

        .page-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:2500;display:flex;justify-content:center;align-items:center;padding:1rem}
        .page-modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radiusLg);max-width:600px;width:100%;max-height:80vh;overflow-y:auto;padding:2rem;animation:modalIn 0.3s ease}

        .article-container{display:flex;gap:2rem;margin-top:1rem}
        .article-main{flex:1;min-width:0}
        .article-title{font-size:2rem;font-weight:800;margin-bottom:0.5rem}
        .article-meta{display:flex;flex-wrap:wrap;gap:1rem;font-size:0.85rem;color:var(--text2);margin-bottom:1rem}
        .article-content{line-height:1.7;color:var(--text2);font-size:0.95rem;word-wrap:break-word;overflow:hidden}
        /* Image slider (floats right) */
        .article-image-slider{position:relative;float:right;width:45%;margin:0.5rem 0 0.5rem 1.5rem;border-radius:var(--radius);overflow:hidden;background:var(--bg3);z-index:2}

        .slider-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.7);color:#fff;border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;transition:background 0.2s;z-index:3}

        .share-btn{margin-left:0.5rem;background:transparent;border:1px solid var(--text3);color:var(--text3);padding:0.4rem 1rem;border-radius:20px;cursor:pointer}
        .share-btn:hover{color:var(--accent);border-color:var(--accent)}
        .comment-input{display:flex;gap:0.5rem;margin-top:0.5rem}
        .comment-input input{flex:1;padding:0.5rem 0.6rem;max-width:400px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);font-family:inherit;font-size:0.85rem}
        .comment-input button{background:var(--accent);color:#000;border:none;padding:0.4rem 1rem;border-radius:20px;cursor:pointer;font-weight:600}
        .comment-item{background:var(--bg3);padding:0.5rem;border-radius:var(--radius);margin:0.3rem 0;font-size:0.8rem}
        .comment-reply{color:var(--accent);cursor:pointer;font-size:0.75rem;margin-left:0.5rem}
        .reply-form{margin-left:1.5rem;margin-top:0.3rem;display:flex;gap:0.3rem;flex-wrap:wrap;align-items:center}
        .reply-form input{padding:0.4rem 0.5rem;max-width:300px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);font-size:0.8rem;flex:1;min-width:80px}
        .reply-form button{padding:0.3rem 0.6rem;border-radius:20px;font-size:0.65rem;background:var(--accent);color:#000;border:none;cursor:pointer}
        .reply-item{margin-left:1.5rem;border-left:2px solid var(--border);padding-left:0.8rem;margin-top:0.3rem;font-size:0.78rem}
        .comment-like{color:var(--accent);cursor:pointer;font-size:0.68rem;margin-top:0.2rem;display:inline-flex;align-items:center;gap:0.15rem}
        .verified-badge{display:inline-flex;align-items:center;gap:0.2rem;color:var(--accent);font-weight:600;font-size:0.65rem;margin-left:0.3rem;background:rgba(245,197,24,0.1);padding:0.15rem 0.4rem;border-radius:12px}
        .load-more-comments{color:var(--accent);cursor:pointer;font-size:0.8rem;margin-top:0.5rem;display:inline-block}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:0.6rem 1.5rem;border-radius:30px;z-index:9999;font-weight:600;font-size:0.85rem;animation:toastIn 0.3s ease;pointer-events:none}
        @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @media(max-width:768px){
            .hero-news{flex-direction:column}
            .hero-news img{width:100%;height:200px}
            .navbar{flex-direction:column;align-items:flex-start}
            .search-box{width:100%}
            .article-container{flex-direction:column}
            .article-sidebar{width:100%}
            .article-image-slider{float:none;width:100%;margin:0.5rem 0 1rem 0}
        }
        /* ===== Social follow row ===== */
        .follow-section{text-align:center;padding:1.5rem 0 0.5rem;animation:fadeIn 0.6s ease}
        .follow-label{font-size:0.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:0.7rem;font-weight:600}
        .social-follow{display:flex;gap:0.7rem;justify-content:center}
        .social-follow a{width:42px;height:42px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:1.15rem;text-decoration:none;transition:var(--trans)}
        .social-follow a:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
        .social-follow a.sf-yt:hover{background:#FF0000;color:#fff;border-color:#FF0000}
        .social-follow a.sf-tiktok:hover{background:#000;color:#fff;border-color:#000}
        .social-follow a.sf-ig:hover{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;border-color:transparent}
        .social-handle{text-align:center;color:var(--accent);font-size:0.8rem;font-weight:600;margin-top:0.6rem}
        /* ===== Ad slots (text / image / video) ===== */
        .ad-slot{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radiusLg);overflow:hidden;animation:fadeIn 0.5s ease}
        .sponsored-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.65);color:var(--text2);font-size:0.58rem;font-weight:600;letter-spacing:0.5px;padding:0.15rem 0.5rem;border-radius:10px;z-index:2;text-transform:uppercase}
        .ad-body{padding:1rem;text-align:center}
        .ad-placeholder-media{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.3rem;background:repeating-linear-gradient(45deg,var(--bg3),var(--bg3) 10px,var(--bg2) 10px,var(--bg2) 20px);border:1.5px dashed var(--border);border-radius:var(--radius);color:var(--text3);font-size:0.7rem;padding:1.4rem 1rem;margin-bottom:0.6rem}
        .ad-placeholder-media .material-symbols-outlined{font-size:1.8rem;color:var(--text3)}
        .ad-body img,.ad-body video{width:100%;border-radius:var(--radius);margin-bottom:0.6rem;object-fit:cover;background:#000}
        .ad-text-title{font-weight:700;font-size:0.85rem;color:var(--accent)}
        .ad-text-desc{font-size:0.78rem;color:var(--text2);margin-top:0.25rem;line-height:1.4}
        .ad-cta{display:inline-flex;align-items:center;gap:0.25rem;background:var(--accent);color:#000;padding:0.35rem 0.9rem;border-radius:20px;font-weight:700;font-size:0.72rem;text-decoration:none;margin-top:0.6rem}
        .ad-cta:hover{background:#d4a810}
        .ad-contact-line{font-size:0.66rem;color:var(--text3);margin-top:0.4rem}
        .ad-slot-top{margin:0.8rem 0}.ad-slot-top .ad-body{padding:0.7rem 1rem;display:flex;align-items:center;justify-content:center;gap:0.6rem;flex-wrap:wrap;text-align:left}.ad-slot-top .ad-placeholder-media{padding:0.5rem 0.9rem;flex-direction:row;margin-bottom:0}.ad-slot-top img,.ad-slot-top video{max-height:44px;width:auto;border-radius:8px;margin-bottom:0}
        .ad-slot-infeed .ad-placeholder-media{padding:2.4rem 1rem}
        .ad-slot-sidebar{margin-top:1rem}
        .ad-slot-article-mid{margin:1.5rem 0}
        .ad-slot-footer{margin:1rem 1.5rem 0}
    </style>
    <!-- Monetag Ad Tags -->
    <script src="https://5gvci.com/act/files/tag.min.js?z=11238838" data-cfasync="false" async></script>
    <script>(function(s){s.dataset.zone='11482358',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<script>
const API = 'https://niromovie-api.onrender.com/api';
let currentFilter = 'all', currentNewsId = null, allNewsData = [], currentArticleComments = [];
window.currentImages = [];
window.currentSlideIndex = 0;

function escHtml(t){var d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function adminPrefixName(name){ return '🔵 ' + name; }
function cleanVerifiedName(raw){ if(typeof raw !== 'string') return raw; if(raw.startsWith('🔵 ')) return raw.substring(3); return raw; }
function isVerifiedName(raw){ return typeof raw === 'string' && raw.startsWith('🔵 '); }

// ========================================================================
// ADS ENGINE (demo/placeholder data below — edit adsConfig to plug in real
// ads later, or swap loadAdsFromConfig() for a fetch('/api/ads') call like
// your niroMovie site already does. Each ad supports type: 'text' | 'image' | 'video'.
// ========================================================================
const adsConfig = {
    top: [],
    infeed: [],
    sidebar: [],
    articleMid: [],
    footer: []
};

function renderAdInner(ad) {
    if (!ad) return '';
    var media = '';
    if (ad.type === 'image') {
        media = ad.mediaUrl
            ? `<img src="${ad.mediaUrl}" onerror="this.style.display='none'">`
            : `<div class="ad-placeholder-media"><span class="material-symbols-outlined">image</span><span>Image ad goes here (e.g. 728×90 banner or 300×250 box)</span></div>`;
    } else if (ad.type === 'video') {
        media = ad.mediaUrl
            ? `<video src="${ad.mediaUrl}" autoplay muted loop playsinline></video>`
            : `<div class="ad-placeholder-media"><span class="material-symbols-outlined">videocam</span><span>Short muted autoplay video ad goes here</span></div>`;
    }
    var cta = ad.link ? `<a class="ad-cta" href="${ad.link}" target="_blank">Learn More <span class="material-symbols-outlined" style="font-size:0.9rem">arrow_forward</span></a>` : '';
    var contact = (ad.contactPhone || ad.businessName) ? `<div class="ad-contact-line">${escHtml(ad.businessName||'')} ${escHtml(ad.contactPhone||'')}</div>` : '';
    return `<span class="sponsored-tag">Sponsored</span>
        <div class="ad-body">
            ${media}
            <div class="ad-text-title">${escHtml(ad.title||'')}</div>
            ${ad.description ? `<div class="ad-text-desc">${escHtml(ad.description)}</div>` : ''}
            ${cta}
            ${contact}
        </div>`;
}
function renderAdCard(ad, extraClass) {
    if (!ad) return '';
    return `<div class="ad-slot ${extraClass||''}">${renderAdInner(ad)}</div>`;
}
function loadAdSlot(elId, configKey) {
    const el = document.getElementById(elId);
    if (!el) return;
    const ad = (adsConfig[configKey] || [])[0];
    if (!ad) { el.style.display = 'none'; el.innerHTML=''; return; }
    el.innerHTML = renderAdInner(ad);
    el.style.display = 'block';
}
function getInfeedAdHTML(cycleIndex) {
    const ads = adsConfig.infeed || [];
    if (!ads.length) return '';
    return renderAdCard(ads[cycleIndex % ads.length], 'ad-slot-infeed');
}
function loadAllAdSlots() {
    loadAdSlot('adTop', 'top');
    loadAdSlot('adFooter', 'footer');
}
function loadArticleAdSlots() {
    loadAdSlot('adSidebar', 'sidebar');
    loadAdSlot('adArticleMid', 'articleMid');
}

// ========== List View ==========
async function loadNews() {
    let query = '';
    if (currentFilter !== 'all') query = '?' + currentFilter;
    const search = document.getElementById('searchNews').value.trim();
    if (search) query += (query?'&':'?') + 'search=' + encodeURIComponent(search);
    try {
        const res = await fetch(API + '/news' + query);
        const data = await res.json();
        allNewsData = data;
        renderHero(data);
        renderNewsList(data);
    } catch(e) { console.error(e); }
}

function renderHero(news) {
    const hero = document.getElementById('heroNews');
    if (!news.length) { hero.style.display='none'; return; }
    const n = news[0];
    hero.style.display = 'flex';
    hero.innerHTML = `
        <img src="${n.thumbnailUrl || (n.images&&n.images[0]) || ''}" onerror="this.style.display='none'">
        <div class="hero-news-body">
            <span class="category">${n.category || 'General'}</span>
            <h2>${escHtml(n.title)}</h2>
            <p>${(n.description || '').replace(/<[^>]*>/g,'').substring(0,150)}</p>
            <button class="btn btn-accent" onclick="event.stopPropagation();showArticle('${n._id}')">Read More →</button>
        </div>`;
    hero.onclick = () => showArticle(n._id);
}

function renderNewsList(news) {
    const grid = document.getElementById('newsList');
    const items = news.slice(1);
    if (!items.length) {
        grid.innerHTML = '<p style="color:var(--text2);text-align:center;padding:2rem">No news found.</p>';
        return;
    }
    let html = '';
    let adCycle = 0;
    items.forEach((n, i) => {
        const img = n.thumbnailUrl || (n.images&&n.images[0]) || '';
        html += `<div class="news-card" onclick="showArticle('${n._id}')">
            ${img ? `<img src="${img}" onerror="this.style.display='none'">` : ''}
            <div class="news-card-body">
                <div class="news-card-title">${escHtml(n.title)}</div>
                <div class="news-card-excerpt">${(n.description||'').replace(/<[^>]*>/g,'').substring(0,100)}</div>
                <div class="news-card-meta">
                    <span>${n.country || ''} ${n.category ? '· ' + n.category : ''}</span>
                    <span>♡ ${n.likes || 0}</span>
                </div>
            </div>
        </div>`;
        // in-feed ad every 6 cards
        if ((i + 1) % 6 === 0 && (adsConfig.infeed || []).length) {
            html += getInfeedAdHTML(adCycle);
            adCycle++;
        }
    });
    grid.innerHTML = html;
}

// ========== Article View ==========
async function showArticle(id) {
    if (!id) return;
    currentNewsId = id;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('articleView').style.display = 'block';
    document.getElementById('searchBox').style.display = 'none';
    document.getElementById('listNav').style.display = 'none';
    document.getElementById('articleNav').style.display = 'flex';
    window.history.pushState({}, '', '?id=' + id);

    try {
        const res = await fetch(API + '/news/' + id);
        const news = await res.json();
        currentArticleComments = news.comments || [];
        document.getElementById('articleTitle').textContent = news.title;
        document.getElementById('articleMeta').innerHTML = `
            <span>📅 ${new Date(news.createdAt).toLocaleDateString()}</span>
            <span>🌍 ${news.country || 'Rwanda'}</span>
            <span>🏷️ ${news.category || 'General'}</span>
        `;
        document.getElementById('likeCount').textContent = news.likes || 0;
        document.getElementById('likeError').textContent = '';

        // Image slider
        let images = Array.isArray(news.images) ? [...news.images] : [];
        const imgRegex = /<img[^>]+src="([^">]+)"[^>]*>/gi;
        let descClean = news.description || '';
        let match;
        while ((match = imgRegex.exec(descClean)) !== null) {
            images.push(match[1]);
        }
        descClean = descClean.replace(/<img[^>]*>/gi, '');

        let sliderHtml = '';
        if (images.length > 0) {
            const imgItems = images.map((src, i) => `
                <img src="${src}" class="slider-img" style="display:${i===0?'block':'none'}" onclick="viewImage('${src}')" data-index="${i}">
            `).join('');
            const dots = images.map((_, i) => `
                <span class="slider-dot ${i===0?'active':''}" onclick="goToSlide(${i})"></span>
            `).join('');
            sliderHtml = `
                <div class="article-image-slider" id="articleSlider">
                    ${imgItems}
                    ${images.length > 1 ? `
                        <button class="slider-nav prev" onclick="changeSlide(-1)">‹</button>
                        <button class="slider-nav next" onclick="changeSlide(1)">›</button>
                        <div class="slider-dots">${dots}</div>
                    ` : ''}
                </div>`;
        }
        document.getElementById('articleContent').innerHTML = sliderHtml + descClean;
        window.currentImages = images;
        window.currentSlideIndex = 0;

        // Comments with replies, likes, verified badge
        renderComments(currentArticleComments.slice(0, 2));
        document.getElementById('loadMoreCommentsContainer').style.display = currentArticleComments.length > 2 ? 'block' : 'none';

        // Related and latest (rely on allNewsData loaded)
        loadRelatedByCategory(news.category, news._id);
        loadLatestNews(id);

        // Ads for this view
        loadArticleAdSlots();
    } catch(e) { console.error(e); }
}

function buildCommentHTML(comment, allComments, depth = 0) {
    const replies = allComments.filter(c => c.parentId && c.parentId.toString() === comment._id.toString());
    let replyHTML = '';
    if (replies.length > 0) {
        replyHTML = replies.map(r => buildCommentHTML(r, allComments, depth + 1)).join('');
    }
    const indent = depth > 0 ? 'style="margin-left:1.5rem;border-left:2px solid var(--border);padding-left:0.8rem;"' : '';
    const rawName = comment.userName || 'Anon';
    const isVer = isVerifiedName(rawName);
    const displayName = cleanVerifiedName(rawName);
    const verifiedBadge = isVer ? '<span class="verified-badge">🔵 Verified</span>' : '';
    return `
        <div class="comment-item" ${indent}>
            <div><span class="comment-user">${escHtml(displayName)}</span>${verifiedBadge}<span class="comment-date">${new Date(comment.createdAt).toLocaleString()}</span></div>
            <div class="comment-text">${escHtml(comment.text)}</div>
            <span class="comment-like" onclick="likeComment('${comment._id}')">♡ ${comment.likes || 0}</span>
            <span class="comment-reply" onclick="showReplyForm('${comment._id}')">↩ Reply</span>
            <div class="reply-form" id="replyForm-${comment._id}" style="display:none">
                <input type="text" id="replyName-${comment._id}" placeholder="Your name">
                <input type="text" id="replyText-${comment._id}" placeholder="Write a reply...">
                <button onclick="postReply('${comment._id}')">Reply</button>
            </div>
            ${replyHTML}
        </div>
    `;
}

function renderComments(commentsToShow) {
    const container = document.getElementById('commentsContainer');
    if (!commentsToShow.length) {
        container.innerHTML = '<p style="color:var(--text2);font-size:0.8rem">No comments yet.</p>';
        return;
    }
    const topLevel = commentsToShow.filter(c => !c.parentId);
    container.innerHTML = topLevel.map(c => buildCommentHTML(c, currentArticleComments)).join('');
}

function loadAllComments() {
    renderComments(currentArticleComments);
    document.getElementById('loadMoreCommentsContainer').style.display = 'none';
}

function showReplyForm(commentId) {
    const form = document.getElementById('replyForm-' + commentId);
    form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
}

async function postReply(parentId) {
    const name = document.getElementById('replyName-' + parentId).value.trim();
    const text = document.getElementById('replyText-' + parentId).value.trim();
    if (!name || !text) return showToast('Name and reply required');
    try {
        const res = await fetch(API + '/news/' + currentNewsId + '/comment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userName: name, text, parentId })
        });
        const data = await res.json();
        if (data.success) {
            showArticle(currentNewsId); // refresh
        }
    } catch(e) { console.error(e); }
}

async function likeComment(commentId) {
    const deviceId = localStorage.getItem('deviceId') || (() => { const id = 'dev_' + Math.random().toString(36).substr(2,9); localStorage.setItem('deviceId', id); return id; })();
    try {
        const res = await fetch(API + '/news/' + currentNewsId + '/comment/' + commentId + '/like', {
            method: 'POST',
            headers: { 'X-Device-ID': deviceId }
        });
        const data = await res.json();
        if (res.ok) {
            showArticle(currentNewsId); // refresh likes
        } else {
            showToast(data.error || 'Already liked');
        }
    } catch(e) { console.error(e); }
}

// ========== Related / Latest (sidebar + bottom grid) ==========
function loadRelatedByCategory(category, excludeId) {
    const sidebar = document.getElementById('sidebarRelated');
    if (!sidebar) return;
    const related = allNewsData
        .filter(n => n._id !== excludeId && category && n.category === category)
        .slice(0, 5);
    if (!related.length) {
        sidebar.innerHTML = '<p style="color:var(--text2);font-size:0.8rem">No related news yet.</p>';
        return;
    }
    sidebar.innerHTML = related.map(n => {
        const img = n.thumbnailUrl || (n.images && n.images[0]) || '';
        return `<div class="news-card" onclick="showArticle('${n._id}')">
            ${img ? `<img src="${img}" onerror="this.style.display='none'">` : ''}
            <div class="news-card-body">
                <div class="news-card-title">${escHtml(n.title)}</div>
                <div class="news-card-meta">
                    <span>${n.country || ''} ${n.category ? '· ' + n.category : ''}</span>
                    <span>♡ ${n.likes || 0}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

function loadLatestNews(excludeId) {
    const grid = document.getElementById('bottomLatest');
    if (!grid) return;
    const latest = allNewsData
        .filter(n => n._id !== excludeId)
        .slice()
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .slice(0, 8);
    if (!latest.length) {
        grid.innerHTML = '<p style="color:var(--text2);font-size:0.8rem">No news yet.</p>';
        return;
    }
    grid.innerHTML = latest.map(n => {
        const img = n.thumbnailUrl || (n.images && n.images[0]) || '';
        return `<div class="news-card" onclick="showArticle('${n._id}')">
            ${img ? `<img src="${img}" onerror="this.style.display='none'">` : ''}
            <div class="news-card-body">
                <div class="news-card-title">${escHtml(n.title)}</div>
                <div class="news-card-excerpt">${(n.description||'').replace(/<[^>]*>/g,'').substring(0,100)}</div>
                <div class="news-card-meta">
                    <span>${n.country || ''} ${n.category ? '· ' + n.category : ''}</span>
                    <span>♡ ${n.likes || 0}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

// Slider controls
function changeSlide(direction) {
    const images = window.currentImages;
    if (!images || images.length <= 1) return;
    window.currentSlideIndex = (window.currentSlideIndex + direction + images.length) % images.length;
    updateSlider();
}

function goToSlide(index) {
    window.currentSlideIndex = index;
    updateSlider();
}

function updateSlider() {
    const slider = document.getElementById('articleSlider');
    if (!slider) return;
    const imgs = slider.querySelectorAll('.slider-img');
    const dots = slider.querySelectorAll('.slider-dot');
    imgs.forEach((img, i) => img.style.display = i === window.currentSlideIndex ? 'block' : 'none');
    dots.forEach((dot, i) => dot.classList.toggle('active', i === window.currentSlideIndex));
}

function viewImage(src) {
    const overlay = document.createElement('div');
    overlay.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:3000;display:flex;justify-content:center;align-items:center;cursor:pointer;';
    overlay.innerHTML = `<img src="${src}" style="max-width:95%;max-height:95%;object-fit:contain;border-radius:18px"><span style="position:absolute;top:1rem;right:1rem;color:#F5C518;font-size:2rem;">&times;</span>`;
    overlay.onclick = () => document.body.removeChild(overlay);
    document.body.appendChild(overlay);
}

async function likeNews() {
    const deviceId = localStorage.getItem('deviceId') || (() => { const id = 'dev_' + Math.random().toString(36).substr(2,9); localStorage.setItem('deviceId', id); return id; })();
    try {
        const res = await fetch(API + '/news/' + currentNewsId + '/like', { method:'POST', headers:{'X-Device-ID':deviceId} });
        const data = await res.json();
        if (res.ok) { document.getElementById('likeCount').textContent = data.likes; showToast('Liked!'); }
        else { document.getElementById('likeError').textContent = data.error; }
    } catch(e) { console.error(e); }
}

function shareArticle() {
    const url = window.location.href;
    if (navigator.share) { navigator.share({ title: document.title, url }); }
    else { navigator.clipboard.writeText(url).then(() => showToast('Link copied!')); }
}

async function postComment() {
    const name = document.getElementById('commentName').value.trim();
    const text = document.getElementById('commentText').value.trim();
    if (!name || !text) return showToast('Name and comment required');
    try {
        const res = await fetch(API + '/news/' + currentNewsId + '/comment', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ userName: name, text })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('commentName').value = '';
            document.getElementById('commentText').value = '';
            showArticle(currentNewsId);
        }
    } catch(e) { console.error(e); }
}

// Back to list
document.getElementById('articleNav').addEventListener('click', function(e) {
    if (e.target.closest('.back-btn')) {
        document.getElementById('listView').style.display = 'block';
        document.getElementById('articleView').style.display = 'none';
        document.getElementById('searchBox').style.display = 'flex';
        document.getElementById('listNav').style.display = 'flex';
        document.getElementById('articleNav').style.display = 'none';
        window.history.pushState({}, '', '/');
        currentNewsId = null;
        // Reload list with current filter if needed
        loadNews();
    }
});

// ========== Helper to sync filter buttons ==========
function setActiveFilterButton(filter) {
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.filter === filter) btn.classList.add('active');
    });
}

// ========== Filters (button row) ==========
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        loadNews();
    });
});

// ========== Init ==========
window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    // Load all news data first (needed for related/latest in article view)
    try {
        const res = await fetch(API + '/news');
        allNewsData = await res.json();
    } catch(e) {
        allNewsData = [];
    }
    loadAllAdSlots();
    if (id) {
        await showArticle(id);
    } else {
        loadNews();
    }
});
</script>
