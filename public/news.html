<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>niroNews | Cinema News</title>
    <meta name="description" content="Latest cinema news, movie updates, and exclusive stories.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        :root {
            --bg: #0d0d0d;
            --bg2: #161616;
            --bg3: #1e1e1e;
            --text: #f0f0f0;
            --text2: #a0a0a0;
            --text3: #666;
            --accent: #F5C518;
            --red: #E53935;
            --green: #25D366;
            --border: #2a2a2a;
            --radius: 12px;
            --radiusLg: 18px;
            --shadow: 0 8px 30px rgba(0,0,0,0.5);
            --trans: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
        /* Scrollbar */
        ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:var(--bg); } ::-webkit-scrollbar-thumb { background:var(--text3); border-radius:10px; }
        /* Navbar */
        .navbar { position:sticky; top:0; z-index:1000; background:rgba(13,13,13,0.94); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0.8rem 1.5rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.8rem; }
        .logo { display:flex; align-items:center; gap:0.5rem; cursor:pointer; text-decoration:none; }
        .logo i { font-size:1.8rem; color:var(--accent); } .logo span { font-weight:800; font-size:1.2rem; color:var(--text); } .logo span b { color:var(--accent); }
        .nav-links { display:flex; gap:0.3rem; flex-wrap:wrap; align-items:center; }
        .nav-link { color:var(--text2); text-decoration:none; font-weight:500; font-size:0.82rem; padding:0.4rem 0.8rem; border-radius:30px; transition:var(--trans); cursor:pointer; }
        .nav-link:hover, .nav-link.active { color:var(--accent); background:rgba(245,197,24,0.06); }
        .nav-link.visit-site { background:var(--accent); color:#000; font-weight:700; } .nav-link.visit-site:hover { background:#d4a810; }
        .search-box { display:flex; align-items:center; background:var(--bg3); border-radius:30px; padding:0.4rem 1rem; gap:0.4rem; width:220px; }
        .search-box input { background:transparent; border:none; color:var(--text); outline:none; width:100%; font-family:inherit; font-size:0.82rem; }
        .search-box input::placeholder { color:var(--text3); }
        /* Hero */
        .hero-news { background:var(--bg2); border-radius:var(--radiusLg); overflow:hidden; margin:1.5rem auto; max-width:1200px; display:flex; border:1px solid var(--border); animation: fadeInUp 0.6s ease; }
        .hero-news img { width:50%; object-fit:cover; background:var(--bg3); }
        .hero-news-body { padding:2rem; display:flex; flex-direction:column; justify-content:center; gap:0.5rem; }
        .hero-news-body .category { color:var(--accent); font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; }
        .hero-news-body h2 { font-size:1.5rem; font-weight:800; }
        .hero-news-body p { color:var(--text2); font-size:0.9rem; line-height:1.4; }
        .btn { display:inline-flex; align-items:center; gap:0.3rem; padding:0.5rem 1.2rem; border-radius:30px; font-weight:600; font-size:0.82rem; cursor:pointer; border:none; font-family:inherit; transition:var(--trans); }
        .btn-accent { background:var(--accent); color:#000; } .btn-accent:hover { background:#d4a810; transform:translateY(-2px); }
        .container { max-width:1200px; margin:0 auto; padding:1rem 1.5rem; }
        /* Filters */
        .filters { display:flex; gap:0.8rem; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center; }
        .filter-btn { padding:0.5rem 1.2rem; border-radius:30px; border:1px solid var(--border); background:var(--bg2); color:var(--text2); cursor:pointer; font-weight:500; font-size:0.8rem; transition:var(--trans); }
        .filter-btn:hover, .filter-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(245,197,24,0.04); }
        /* News grid */
        .news-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; margin-bottom:2rem; }
        .news-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radiusLg); overflow:hidden; cursor:pointer; transition:var(--trans); animation: fadeIn 0.5s ease; }
        .news-card:hover { transform:translateY(-4px); box-shadow:var(--shadow); border-color:var(--accent); }
        .news-card img { width:100%; height:180px; object-fit:cover; background:var(--bg3); }
        .news-card-body { padding:1rem; }
        .news-card-title { font-weight:700; margin-bottom:0.3rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .news-card-excerpt { font-size:0.8rem; color:var(--text2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .news-card-meta { display:flex; justify-content:space-between; margin-top:0.5rem; font-size:0.7rem; color:var(--text3); }
        /* Ticker */
        .ticker-wrap { background:var(--bg2); border-bottom:1px solid var(--border); overflow:hidden; padding:0.4rem 1rem; }
        .ticker { display:flex; animation: ticker 30s linear infinite; white-space:nowrap; }
        .ticker-item { margin-right:3rem; color:var(--accent); font-weight:500; font-size:0.8rem; }
        @keyframes ticker { 0%{ transform:translateX(0); } 100%{ transform:translateX(-50%); } }
        /* Detail modal */
        .detail-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:2000; display:flex; justify-content:center; align-items:center; padding:1rem; backdrop-filter:blur(4px); }
        .detail-box { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radiusLg); max-width:800px; width:100%; max-height:90vh; overflow-y:auto; padding:2rem; position:relative; animation: modalIn 0.3s ease; }
        @keyframes modalIn { from{ opacity:0; transform:scale(0.95); } to{ opacity:1; transform:scale(1); } }
        .detail-close { position:absolute; top:1rem; right:1rem; cursor:pointer; font-size:1.5rem; color:var(--text2); } .detail-close:hover { color:var(--accent); }
        .detail-title { font-size:1.5rem; font-weight:800; margin-bottom:1rem; }
        .detail-meta { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; font-size:0.8rem; color:var(--text2); }
        .detail-content { line-height:1.6; color:var(--text2); margin-bottom:1.5rem; }
        .detail-content img { max-width:100%; border-radius:var(--radius); margin:0.8rem 0; cursor:pointer; }
        .like-section, .comment-section { margin-top:1rem; }
        .like-btn { background:transparent; border:1px solid var(--accent); color:var(--accent); padding:0.4rem 1rem; border-radius:20px; cursor:pointer; font-weight:600; }
        .like-btn:hover { background:rgba(245,197,24,0.1); }
        .comment-input { display:flex; gap:0.5rem; margin-top:0.5rem; }
        .comment-input input { flex:1; padding:0.4rem; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:var(--radius); font-family:inherit; }
        .comment-input button { background:var(--accent); color:#000; border:none; padding:0.4rem 1rem; border-radius:20px; cursor:pointer; font-weight:600; }
        .comment-item { background:var(--bg3); padding:0.5rem; border-radius:var(--radius); margin:0.3rem 0; font-size:0.8rem; }
        .related-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:0.8rem; margin-top:1rem; }
        .related-card { background:var(--bg3); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:var(--trans); }
        .related-card:hover { border-color:var(--accent); transform:translateY(-2px); }
        .related-card img { width:100%; height:100px; object-fit:cover; background:var(--bg); }
        .related-card-body { padding:0.5rem; }
        .related-card-title { font-size:0.75rem; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        /* Footer */
        .footer { text-align:center; padding:2rem; color:var(--text3); font-size:0.75rem; border-top:1px solid var(--border); margin-top:2rem; display:flex; flex-wrap:wrap; justify-content:center; gap:2rem; }
        .footer-links { display:flex; gap:1rem; }
        .footer-links a { color:var(--text2); text-decoration:none; cursor:pointer; } .footer-links a:hover { color:var(--accent); }
        /* Modal for static pages */
        .page-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2500; display:flex; justify-content:center; align-items:center; padding:1rem; }
        .page-modal-box { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radiusLg); max-width:600px; width:100%; max-height:80vh; overflow-y:auto; padding:2rem; animation: modalIn 0.3s ease; }
        /* Toast notifications */
        .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:#000; padding:0.6rem 1.5rem; border-radius:30px; z-index:9999; font-weight:600; font-size:0.85rem; animation: toastIn 0.3s ease; pointer-events:none; }
        @keyframes toastIn { from{ opacity:0; transform:translateX(-50%) translateY(20px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }
        /* Help bubble */
        .help-bubble { position:fixed; bottom:20px; right:20px; background:var(--accent); color:#000; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:1500; font-size:1.2rem; box-shadow:0 4px 15px rgba(245,197,24,0.3); transition:var(--trans); }
        .help-bubble:hover { transform:scale(1.1); background:#d4a810; }
        /* Ad banner custom */
        .custom-ad-banner { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; text-align:center; margin:1rem 0; color:var(--text2); font-size:0.85rem; display:flex; justify-content:center; align-items:center; gap:0.5rem; min-height:60px; }
        @keyframes fadeIn { from{ opacity:0; } to{ opacity:1; } }
        @keyframes fadeInUp { from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }
        @media(max-width:768px) {
            .hero-news { flex-direction:column; }
            .hero-news img { width:100%; height:200px; }
            .navbar { flex-direction:column; align-items:flex-start; }
            .search-box { width:100%; }
            .page-modal-box { padding:1.5rem; }
        }
    </style>
    <!-- Monetag Ad Tags -->
    <script src="https://5gvci.com/act/files/tag.min.js?z=11238838" data-cfasync="false" async></script>
    <script>(function(s){s.dataset.zone='11482358',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</head>
<body>
<!-- Navbar -->
<div class="navbar">
    <a href="/news" class="logo"><i class="material-symbols-outlined">article</i><span><b>niro</b>News</span></a>
    <div class="nav-links">
        <a href="/news" class="nav-link active">Home</a>
        <a href="#" class="nav-link" onclick="filterNews('category=Action')">Action</a>
        <a href="#" class="nav-link" onclick="filterNews('category=Drama')">Drama</a>
        <a href="#" class="nav-link" onclick="filterNews('country=Rwanda')">🇷🇼 Rwanda</a>
        <a href="#" class="nav-link" onclick="filterNews('sort=likes')">Most Liked</a>
        <a href="https://niromovie.site" class="nav-link visit-site" target="_blank"><i class="fas fa-play"></i> Visit niroMovie</a>
    </div>
    <div class="search-box">
        <span class="material-symbols-outlined" style="color:var(--text3)">search</span>
        <input type="text" id="searchNews" placeholder="Search news..." oninput="loadNews()">
    </div>
</div>
<!-- Breaking News Ticker -->
<div class="ticker-wrap">
    <div class="ticker" id="ticker">Loading latest headlines...</div>
</div>
<!-- Hero featured news -->
<div class="container">
    <div class="hero-news" id="heroNews" style="display:none"></div>
    <!-- Custom Ad Banner (can be edited manually) -->
    <div class="custom-ad-banner" id="customAdBanner">
        <span>📢 Advertise with us – <a href="mailto:news@niromovie.site" style="color:var(--accent);">news@niromovie.site</a> | Call: +250 795 064 502</span>
    </div>
    <!-- Filters -->
    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="category=Action">Action</button>
        <button class="filter-btn" data-filter="category=Drama">Drama</button>
        <button class="filter-btn" data-filter="category=Comedy">Comedy</button>
        <button class="filter-btn" data-filter="category=Romance">Romance</button>
        <button class="filter-btn" data-filter="country=Rwanda">🇷🇼 Rwanda</button>
        <button class="filter-btn" data-filter="sort=likes">Most Liked</button>
    </div>
    <div class="news-grid" id="newsList"></div>
</div>
<!-- Footer -->
<div class="footer">
    <div class="footer-links">
        <a onclick="openStaticModal('about')">About</a>
        <a onclick="openStaticModal('contact')">Contact</a>
        <a onclick="openStaticModal('privacy')">Privacy</a>
        <a onclick="openStaticModal('terms')">Terms</a>
    </div>
    <span>© 2026 — powered by <strong>niroflixx</strong></span>
</div>
<!-- Detail modal -->
<div class="detail-overlay" id="detailOverlay" style="display:none">
    <div class="detail-box" id="detailBox"></div>
</div>
<!-- Static page modals -->
<div id="staticModal" class="page-modal" style="display:none" onclick="if(event.target===this)closeStaticModal()">
    <div class="page-modal-box" id="staticModalContent"></div>
</div>
<!-- Help Bubble -->
<div class="help-bubble" id="helpBubble" onclick="toggleHelp()">?</div>
<!-- Toast container -->
<div id="toast" class="toast" style="display:none"></div>

<script>
const API = 'https://niromovie-api.onrender.com/api';
let currentFilter = 'all', currentNewsId = null, allNewsData = [];

// Toast helper
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

// Help bubble interaction
function toggleHelp() {
    showToast('Need help? Email news@niromovie.site or call +250795064502. Visit niroMovie for movies!');
}

// Load news
async function loadNews() {
    let query = '';
    if (currentFilter !== 'all') query = '?' + currentFilter;
    const search = document.getElementById('searchNews').value.trim();
    if (search) query += (query?'&':'?') + 'search=' + encodeURIComponent(search);
    try {
        const res = await fetch(API + '/news' + query);
        const data = await res.json();
        allNewsData = data;
        updateTicker(data);
        renderHero(data);
        renderNewsList(data);
    } catch(e) { console.error(e); }
}

function updateTicker(news) {
    if (!news.length) return;
    const ticker = document.getElementById('ticker');
    const headlines = news.slice(0, 5).map(n => n.title).join(' &nbsp; | &nbsp; ');
    ticker.innerHTML = headlines + ' &nbsp; | &nbsp; ' + headlines; // duplicate for seamless loop
}

function renderHero(news) {
    const hero = document.getElementById('heroNews');
    if (!news.length) { hero.style.display='none'; return; }
    const n = news[0];
    hero.style.display = 'flex';
    hero.innerHTML = `
        <img src="${n.thumbnailUrl || (n.images&&n.images[0]) || ''}" onerror="this.style.display='none'">
        <div class="hero-news-body">
            <span class="category">${n.category || 'General'}</span>
            <h2>${escHtml(n.title)}</h2>
            <p>${(n.description || '').replace(/<[^>]*>/g,'').substring(0,150)}</p>
            <button class="btn btn-accent" onclick="event.stopPropagation();openDetail('${n._id}')">Read More →</button>
        </div>`;
    hero.onclick = () => openDetail(n._id);
}

function renderNewsList(news) {
    const grid = document.getElementById('newsList');
    const start = 1; // skip first (hero)
    const items = news.slice(start);
    if (!items.length) {
        grid.innerHTML = '<p style="color:var(--text2);text-align:center;padding:2rem">No news found.</p>';
        return;
    }
    grid.innerHTML = items.map(n => {
        const img = n.thumbnailUrl || (n.images&&n.images[0]) || '';
        return `<div class="news-card" onclick="openDetail('${n._id}')">
            ${img ? `<img src="${img}" onerror="this.style.display='none'">` : ''}
            <div class="news-card-body">
                <div class="news-card-title">${escHtml(n.title)}</div>
                <div class="news-card-excerpt">${(n.description||'').replace(/<[^>]*>/g,'').substring(0,100)}</div>
                <div class="news-card-meta">
                    <span>${n.country || ''} ${n.category ? '· ' + n.category : ''}</span>
                    <span>♡ ${n.likes || 0}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

function escHtml(t) { var d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }

// Detail modal
function openDetail(id) {
    fetch(API + '/news/' + id).then(r => r.json()).then(news => {
        currentNewsId = id;
        const overlay = document.getElementById('detailOverlay');
        const box = document.getElementById('detailBox');
        let imagesHtml = '';
        if (news.images && news.images.length) {
            imagesHtml = news.images.map(img => `<img src="${img}" style="max-width:100%;cursor:pointer" onclick="window.open('${img}')">`).join('');
        }
        box.innerHTML = `
            <span class="detail-close" onclick="closeDetail()">&times;</span>
            <h2 class="detail-title">${escHtml(news.title)}</h2>
            <div class="detail-meta">
                <span>📅 ${new Date(news.createdAt).toLocaleDateString()}</span>
                <span>🌍 ${news.country || 'Rwanda'}</span>
                <span>🏷️ ${news.category || 'General'}</span>
                <span>♡ <span id="likeCount">${news.likes || 0}</span></span>
            </div>
            <div class="detail-content">${imagesHtml}${news.description || ''}</div>
            <div class="like-section">
                <button class="like-btn" onclick="likeNews()">♡ Like</button>
                <span id="likeError" style="color:var(--red);font-size:0.8rem;margin-left:0.5rem;"></span>
            </div>
            <div class="comment-section">
                <h4>Comments</h4>
                <div id="commentsContainer">${(news.comments||[]).map(c => `<div class="comment-item"><strong>${escHtml(c.userName)}</strong> · ${new Date(c.createdAt).toLocaleString()}<br>${escHtml(c.text)}</div>`).join('')}</div>
                <div class="comment-input">
                    <input type="text" id="commentName" placeholder="Your name">
                    <input type="text" id="commentText" placeholder="Write a comment...">
                    <button onclick="postComment()">Post</button>
                </div>
            </div>
            <h4 style="margin-top:1rem">Related News</h4>
            <div class="related-grid" id="relatedGrid"></div>
        `;
        overlay.style.display = 'flex';
        overlay.onclick = function(e) { if (e.target === overlay) closeDetail(); };
        loadRelatedNews(news);
    });
}

function closeDetail() {
    document.getElementById('detailOverlay').style.display = 'none';
    currentNewsId = null;
}

function loadRelatedNews(current) {
    const related = allNewsData.filter(n => n._id !== current._id).slice(0, 4);
    const grid = document.getElementById('relatedGrid');
    if (!grid) return;
    grid.innerHTML = related.map(n => `
        <div class="related-card" onclick="closeDetail();setTimeout(()=>openDetail('${n._id}'),300)">
            ${n.thumbnailUrl ? `<img src="${n.thumbnailUrl}">` : ''}
            <div class="related-card-body"><div class="related-card-title">${escHtml(n.title)}</div></div>
        </div>`).join('');
}

async function likeNews() {
    const deviceId = localStorage.getItem('deviceId') || (() => { const id = 'dev_' + Math.random().toString(36).substr(2,9); localStorage.setItem('deviceId', id); return id; })();
    try {
        const res = await fetch(API + '/news/' + currentNewsId + '/like', {
            method: 'POST',
            headers: { 'X-Device-ID': deviceId }
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('likeCount').textContent = data.likes;
            document.getElementById('likeError').textContent = '';
        } else {
            document.getElementById('likeError').textContent = data.error;
        }
    } catch(e) { console.error(e); }
}

async function postComment() {
    const name = document.getElementById('commentName').value.trim();
    const text = document.getElementById('commentText').value.trim();
    if (!name || !text) return showToast('Name and comment required');
    try {
        const res = await fetch(API + '/news/' + currentNewsId + '/comment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userName: name, text })
        });
        const data = await res.json();
        if (data.success) openDetail(currentNewsId);
    } catch(e) { console.error(e); }
}

// Static pages modals
function openStaticModal(page) {
    const modal = document.getElementById('staticModal');
    const content = document.getElementById('staticModalContent');
    let html = '';
    switch(page) {
        case 'about':
            html = `<h2>About niroNews</h2><p style="color:var(--text2);line-height:1.6">niroNews is the official cinema news portal of <strong>niroMovie</strong>. We bring the latest updates about movies, series, and the entertainment world. Founded by <strong>Niyonkuru Robert</strong> (niro bwimba), we are committed to keeping Rwandan and global audiences informed. Contact: <a href="mailto:news@niromovie.site" style="color:var(--accent)">news@niromovie.site</a></p>`;
            break;
        case 'contact':
            html = `<h2>Contact Us</h2><p style="color:var(--text2);line-height:1.6">📧 Email: <strong>news@niromovie.site</strong><br>📞 Phone: <strong>+250 795 064 502</strong><br>👤 Founder: Niyonkuru Robert (niro bwimba)<br><br>For advertising or news tips, reach out anytime.</p>`;
            break;
        case 'privacy':
            html = `<h2>Privacy Policy</h2><p style="color:var(--text2);line-height:1.6">We only collect minimal data (device ID for likes, name for comments). We never sell or share personal information. All data is stored securely and used solely for site functionality. By using niroNews, you agree to this policy.</p>`;
            break;
        case 'terms':
            html = `<h2>Terms of Service</h2><p style="color:var(--text2);line-height:1.6">Content on niroNews is for informational purposes only. Redistribution or commercial use is prohibited. We reserve the right to modify or remove content. Users are responsible for their comments and interactions. Violation of these terms may result in restricted access.</p>`;
            break;
    }
    content.innerHTML = html + `<button class="btn btn-accent" style="margin-top:1rem" onclick="closeStaticModal()">Close</button>`;
    modal.style.display = 'flex';
}

function closeStaticModal() {
    document.getElementById('staticModal').style.display = 'none';
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        loadNews();
    });
});

// Init
window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    loadNews();
    if (id) setTimeout(() => openDetail(id), 600);
});
</script>
</body>
</html>
