<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>niroMovie | Cinema News</title>
      <!-- Monetag Push Notifications -->
  <script src="https://5gvci.com/act/files/tag.min.js?z=11238838" data-cfasync="false" async></script>

  <!-- Monetag In-Page Push -->
  <script>(function(s){s.dataset.zone='11482358',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        :root{--bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--text:#f0f0f0;--text2:#a0a0a0;--text3:#666;--accent:#F5C518;--border:#2a2a2a;--radius:12px;--radiusLg:18px;--shadow:0 8px 30px rgba(0,0,0,0.5)}
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .navbar{position:sticky;top:0;z-index:1000;background:rgba(13,13,13,0.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0.8rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
        .logo{display:flex;align-items:center;gap:0.5rem;color:var(--accent);cursor:pointer}
        .logo i{font-size:1.8rem}.logo span{font-weight:800;font-size:1.2rem;color:var(--text)}.logo span b{color:var(--accent)}
        .back-home{color:var(--text2);text-decoration:none;font-size:0.9rem}.back-home:hover{color:var(--accent)}
        .container{max-width:1200px;margin:0 auto;padding:1.5rem}
        .filters{display:flex;gap:0.8rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .filter-btn{padding:0.5rem 1.2rem;border-radius:30px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-weight:500;font-size:0.8rem;transition:all 0.2s}
        .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
        .search-input{padding:0.5rem 1rem;border-radius:30px;border:1px solid var(--border);background:var(--bg2);color:var(--text);width:200px;font-size:0.8rem}
        .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:2rem}
        .news-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radiusLg);overflow:hidden;cursor:pointer;transition:all 0.25s}.news-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
        .news-card img{width:100%;height:180px;object-fit:cover;background:var(--bg3)}
        .news-card-body{padding:1rem}.news-card-title{font-weight:700;margin-bottom:0.3rem}.news-card-excerpt{font-size:0.8rem;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.news-card-meta{display:flex;justify-content:space-between;margin-top:0.5rem;font-size:0.7rem;color:var(--text3)}
        .detail-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:2000;display:flex;justify-content:center;align-items:center;padding:1rem}
        .detail-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radiusLg);max-width:700px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem;position:relative}
        .detail-close{position:absolute;top:1rem;right:1rem;cursor:pointer;font-size:1.5rem;color:var(--text2)}.detail-close:hover{color:var(--accent)}
        .detail-title{font-size:1.5rem;font-weight:800;margin-bottom:1rem}.detail-meta{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;font-size:0.8rem;color:var(--text2)}
        .detail-content{line-height:1.6;color:var(--text2);margin-bottom:1.5rem}
        .detail-content img{max-width:100%;border-radius:var(--radius);margin:0.8rem 0}
        .detail-content .inline-image{float:right;width:45%;margin:0 0 0.5rem 1rem;border-radius:var(--radius)}
        .like-section,.comment-section{margin-top:1rem}.like-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:0.4rem 1rem;border-radius:20px;cursor:pointer}.like-btn:hover{background:rgba(245,197,24,0.1)}.comment-input{display:flex;gap:0.5rem;margin-top:0.5rem}.comment-input input{flex:1;padding:0.4rem;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--radius)}.comment-input button{background:var(--accent);color:#000;border:none;padding:0.4rem 1rem;border-radius:20px;cursor:pointer}.comment-item{background:var(--bg3);padding:0.5rem;border-radius:var(--radius);margin:0.3rem 0;font-size:0.8rem}
        @media(max-width:768px){.detail-content .inline-image{float:none;width:100%;margin:0.5rem 0}}
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="window.location='/'">
        <i class="material-symbols-outlined">play_circle</i>
        <span><b>niro</b>Movie</span>
    </div>
    <a href="/" class="back-home"><i class="fa fa-arrow-left"></i> Back to Home</a>
</div>
<div class="container">
    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="category=Action">Action</button>
        <button class="filter-btn" data-filter="category=Drama">Drama</button>
        <button class="filter-btn" data-filter="category=Comedy">Comedy</button>
        <button class="filter-btn" data-filter="category=Romance">Romance</button>
        <button class="filter-btn" data-filter="country=Rwanda">🇷🇼 Rwanda</button>
        <button class="filter-btn" data-filter="sort=likes">Most Liked</button>
        <input class="search-input" id="searchNews" placeholder="Search news..." oninput="loadNews()">
    </div>
    <div class="news-grid" id="newsList"></div>
</div>
<!-- News Detail Overlay -->
<div class="detail-overlay" id="detailOverlay" style="display:none">
    <div class="detail-box" id="detailBox"></div>
</div>

<script>
const API = 'https://niromovie-api.onrender.com/api';
let currentFilter = 'all', currentNewsId = null;

async function loadNews() {
    let query = '';
    if (currentFilter !== 'all') query = '?' + currentFilter;
    const search = document.getElementById('searchNews').value.trim();
    if (search) query += (query?'&':'?') + 'search=' + encodeURIComponent(search);
    try {
        const res = await fetch(API + '/news' + query);
        const news = await res.json();
        renderNewsList(news);
    } catch (e) { console.error(e); }
}

function renderNewsList(news) {
    const grid = document.getElementById('newsList');
    if (!news.length) {
        grid.innerHTML = '<p style="color:var(--text2);text-align:center;padding:2rem">No news found.</p>';
        return;
    }
    grid.innerHTML = news.map(n => {
        const img = n.thumbnailUrl || (n.images&&n.images[0]) || '';
        const snippet = (n.description || '').replace(/<[^>]*>/g, '').substring(0, 100);
        return `<div class="news-card" onclick="openDetail('${n._id}')">
            ${img ? `<img src="${img}" onerror="this.style.display='none'">` : ''}
            <div class="news-card-body">
                <div class="news-card-title">${escHtml(n.title)}</div>
                <div class="news-card-excerpt">${escHtml(snippet)}</div>
                <div class="news-card-meta">
                    <span>${n.country || ''} ${n.category ? '· ' + n.category : ''}</span>
                    <span>♡ ${n.likes || 0}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

function escHtml(t) { var d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }

function openDetail(id) {
    fetch(API + '/news/' + id).then(r => r.json()).then(news => {
        currentNewsId = id;
        const overlay = document.getElementById('detailOverlay');
        const box = document.getElementById('detailBox');
        let imagesHtml = '';
        if (news.images && news.images.length) {
            imagesHtml = news.images.map(img => `<img src="${img}" class="inline-image" onclick="window.open('${img}')">`).join('');
        }
        box.innerHTML = `
            <span class="detail-close" onclick="closeDetail()">&times;</span>
            <h2 class="detail-title">${escHtml(news.title)}</h2>
            <div class="detail-meta">
                <span>📅 ${new Date(news.createdAt).toLocaleDateString()}</span>
                <span>🌍 ${news.country || 'Rwanda'}</span>
                <span>🏷️ ${news.category || 'General'}</span>
                <span>♡ <span id="likeCount">${news.likes || 0}</span></span>
            </div>
            <div class="detail-content">${imagesHtml}${news.description || ''}</div>
            <div class="like-section">
                <button class="like-btn" onclick="likeNews()">♡ Like</button>
                <span id="likeError" style="color:var(--red);font-size:0.8rem;margin-left:0.5rem;"></span>
            </div>
            <div class="comment-section">
                <h4>Comments</h4>
                <div id="commentsContainer">${(news.comments||[]).map(c => `<div class="comment-item"><strong>${escHtml(c.userName)}</strong> · ${new Date(c.createdAt).toLocaleString()}<br>${escHtml(c.text)}</div>`).join('')}</div>
                <div class="comment-input">
                    <input type="text" id="commentName" placeholder="Your name">
                    <input type="text" id="commentText" placeholder="Write a comment...">
                    <button onclick="postComment()">Post</button>
                </div>
            </div>
        `;
        overlay.style.display = 'flex';
        // Close on backdrop click
        overlay.onclick = function(e) { if (e.target === overlay) closeDetail(); };
    });
}

function closeDetail() {
    document.getElementById('detailOverlay').style.display = 'none';
    currentNewsId = null;
}

async function likeNews() {
    const deviceId = localStorage.getItem('deviceId') || (() => { const id = 'dev_' + Math.random().toString(36).substr(2,9); localStorage.setItem('deviceId', id); return id; })();
    try {
        const res = await fetch(API + '/news/' + currentNewsId + '/like', {
            method: 'POST',
            headers: { 'X-Device-ID': deviceId }
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('likeCount').textContent = data.likes;
            document.getElementById('likeError').textContent = '';
        } else {
            document.getElementById('likeError').textContent = data.error;
        }
    } catch (e) { console.error(e); }
}

async function postComment() {
    const name = document.getElementById('commentName').value.trim();
    const text = document.getElementById('commentText').value.trim();
    if (!name || !text) return alert('Name and comment required');
    try {
        const res = await fetch(API + '/news/' + currentNewsId + '/comment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userName: name, text })
        });
        const data = await res.json();
        if (data.success) {
            // Refresh the detail view
            openDetail(currentNewsId);
        }
    } catch (e) { console.error(e); }
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        loadNews();
    });
});

// Load on page load, and check if there's an ?id= in URL
window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    loadNews();
    if (id) {
        setTimeout(() => openDetail(id), 500);
    }
});
</script>
</body>
</html>
